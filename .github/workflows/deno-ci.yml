name: Deno CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check --unstable-component --ignore='tests/ui/snapshots/*.svg' .

      - name: Type-check app and tests
        run: deno check src/app.js tests/domain/*.js tests/features/*.js tests/state/*.js tests/ui/*.js

      - name: Lint app and tests
        run: deno lint src tests

      - name: Run tests with scoped coverage
        run: deno task coverage

      - name: Add coverage summary
        run: |
          {
            echo '## Unit test coverage'
            echo
            echo 'Scope: src/ modules loaded by non-E2E tests. Unloaded modules and browser E2E are not measured.'
            echo
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            coverage/html/
            coverage/summary.txt
          if-no-files-found: error
          retention-days: 14

  midi-e2e:
    name: MIDI E2E suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node for the browser installer
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install headless Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Check E2E foundation
        run: deno task check

      - name: Run BPM Challenge regression and MIDI E2E tests
        run: deno task test
