name: Deno CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Deno CI PR #{0} @ {1} base {2}', inputs.pr_number, inputs.head_sha, inputs.base_sha) || 'Deno CI' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Reviewed PR number"
        required: true
        type: string
      head_sha:
        description: "Reviewed PR head SHA"
        required: true
        type: string
      base_sha:
        description: "Base SHA used for post-review CI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Format, check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check --unstable-component --ignore='tests/ui/snapshots/*.svg' .

      - name: Type-check app and tests
        run: deno check src/app.js tests/domain/*.js tests/features/*.js tests/state/*.js tests/ui/*.js

      - name: Lint app and tests
        run: deno lint src tests

      - name: Check automation policy
        run: |
          deno check .github/scripts/copilot-lifecycle.cjs tests/automation/*.js
          deno lint .github/scripts

      - name: Run tests with scoped coverage
        run: deno task coverage

      - name: Add coverage summary
        run: |
          {
            echo '## Unit test coverage'
            echo
            echo 'Scope: src/ modules loaded by non-E2E tests. Unloaded modules and browser E2E are not measured.'
            echo
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            coverage/html/
            coverage/summary.txt
          if-no-files-found: error
          retention-days: 14

  midi-e2e:
    name: MIDI E2E suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node for the browser installer
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install headless Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Check E2E foundation
        run: deno task check

      - name: Run BPM Challenge regression and MIDI E2E tests
        run: deno task test
