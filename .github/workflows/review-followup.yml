name: Review follow-up

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Deno CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  request-follow-up:
    if: >-
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Copilot to address review or CI feedback
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const event = context.payload;
            let candidates = [];
            let kind;

            if (context.eventName === "pull_request_review") {
              const pull = event.pull_request;
              if (event.review.commit_id !== pull.head.sha) {
                core.info("Ignoring a review submitted against an outdated commit.");
                return;
              }
              kind = "review";
              candidates = [{
                number: pull.number,
                headSha: pull.head.sha,
                detail: `Review feedback: ${event.review.html_url}`,
                instruction:
                  "Read the requested changes and unresolved review threads, fix them in this PR, run the relevant checks, push the fix, and request another review.",
              }];
            } else {
              const run = event.workflow_run;
              kind = "ci";
              const linkedPulls = run.pull_requests?.length
                ? run.pull_requests
                : (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner,
                    repo,
                    commit_sha: run.head_sha,
                  })).data;

              candidates = linkedPulls.map((pull) => ({
                number: pull.number,
                headSha: run.head_sha,
                detail: `Failed Deno CI run: ${run.html_url}`,
                instruction:
                  "Inspect the failed Deno CI checks, fix the cause in this PR, run the relevant checks, push the fix, and request another review. If the failure is transient, verify that before retrying the job.",
              }));
            }

            for (const candidate of candidates) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: candidate.number,
              });
              if (pull.state !== "open" || pull.head.sha !== candidate.headSha) {
                core.info(`Ignoring outdated or closed PR #${candidate.number}.`);
                continue;
              }

              const marker =
                `<!-- scratchlab-review-followup:${kind}:${candidate.headSha} -->`;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: candidate.number, per_page: 100 },
              );
              if (comments.some((comment) => comment.body?.includes(marker))) {
                core.info(`Follow-up already posted for PR #${candidate.number}.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: candidate.number,
                body: [
                  marker,
                  `@copilot Automated follow-up: ${candidate.detail}`,
                  "",
                  candidate.instruction,
                  "",
                  "Keep the change on this PR's branch. Do not merge or close the PR.",
                ].join("\n"),
              });
            }
